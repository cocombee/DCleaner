[package]
name = "dcleaner"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native Rust PC cleaner with blue semantic tokens"
license = "MIT"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
trash = "=5.2.9"
rfd = "0.17"
dunce = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
png = "0.18"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
zeroize = "=1.9.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_TaskScheduler",
    "Win32_System_Services",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_UpdateAgent",
    "Win32_System_SystemInformation",
    "Win32_Security_Cryptography",
    "Win32_System_Restore",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ApplicationInstallationAndServicing",
] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[profile.release]
strip = true
lto = "thin"
