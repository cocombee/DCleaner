name: Native Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ runner.temp }}/dcleaner-target
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Record compiler versions
        run: |
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Run ordinary tests
        run: cargo +1.98.0 test --locked
      - name: Build native release
        run: cargo +1.98.0 build --locked --release
