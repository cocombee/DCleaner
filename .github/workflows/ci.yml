name: Native Rust checks

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', '*.rs', 'src/**', 'tests/**', 'scripts/**', 'assets/**', '.github/workflows/**']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', '*.rs', 'src/**', 'tests/**', 'scripts/**', 'assets/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill at 10x and Windows at 2x on private repos, so
        # pushes and pull requests check Windows only; start the workflow by
        # hand (Actions > Run workflow) to include macOS.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-2025","macos-15"]' || '["windows-2025"]') }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Record compiler versions
        run: |
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Prepare canonical fixture directory
        shell: python
        run: |
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "dcleaner-fixtures"
          directory.mkdir(parents=True, exist_ok=True)
          directory = directory.resolve(strict=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name in ("TEMP", "TMP", "TMPDIR"):
                  output.write(f"{name}={directory}\n")
      - name: Run ordinary tests
        run: cargo +1.98.0 test --locked
      - name: Build native release
        run: cargo +1.98.0 build --locked --release
